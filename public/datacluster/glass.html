function slabPieces(box, out){

  let thin = 0; for (let k=1;k<3;k++) if (size[k] < size[thin]) thin = k;
  const ax = [0,1,2].filter(k => k !== thin).sort((a, b) => size[b] - size[a])[0];
  if (size[ax] > 0.9 && R() < 0.8){
    const n = size[ax] > 1.5 && R() < 0.5 ? 3 : 2; const cuts = [box[ax]];
    for (let i=1;i<n;i++) cuts.push(box[ax] + size[ax]*(i/n + rnd(-0.12, 0.12)));

    for (let i=0;i<n;i++){ const b = box.slice(); b[ax] = cuts[i]; b[ax+3] = cuts[i+1]; out.push(b); }

function peel(box, depth, out){
  const size = [box[3]-box[0], box[4]-box[1], box[5]-box[2]];
  if (Math.min(...size) < 0.5 || depth > 9){ slabPieces(box, out); return; }
  const w = size.map(v => v*v), sum = w[0] + w[1] + w[2]; let r = R()*sum, ax = 0; while (r > w[ax]) { r -= w[ax]; ax++; }
  const t = Math.min(size[ax]*0.5, rnd(0.2, 0.36)), low = R() < 0.5;
  const slab = box.slice(), rest = box.slice();
  if (low){ slab[ax+3] = box[ax] + t; rest[ax] = box[ax] + t; } else { slab[ax] = box[ax+3] - t; rest[ax+3] = box[ax+3] - t; }
  slabPieces(slab, out); peel(rest, depth + 1, out);
}

  const worldOpen = Math.max(worldDive, .9*arrive*(journey && eye.visible ? 1 : 0));
  eyeMat.uniforms.uOpen.value = worldOpen;
  eyeMat.uniforms.uGain.value = lerp(ghost, 1, worldDive);
  if (journey && (worldOpen > .001 || destinationScreen.visible)) {
    journey.renderPreview(worldOpen, now, mouse, renderer.getPixelRatio());
    eyeMat.uniforms.uImageAspect.value = destinationScreen.material.uniforms.uImageAspect.value = journey.previewAspect;
  }
  zoomBlur.uniforms.uStrength.value = .038*s5(.58, .81, pb)*(1 - s5(.965, 1, pb));
  zoomBlur.enabled = zoomBlur.uniforms.uStrength.value > .00005;

  // a three-quarter view that leans towards the cursor
  cube.rotation.set(0.46 - mouse.y*0.3 + Math.sin(now*0.31)*0.04, -0.62 + mouse.x*0.45 + Math.sin(now*0.23)*0.06, 0, 'XYZ');
  cube.position.y = Math.sin(now*0.6)*0.04;
  world.rotation.y = mouse.x*0.12; world.rotation.x = -mouse.y*0.06;
  cube.updateMatrixWorld(); world.updateMatrixWorld();
  qc.copy(cube.quaternion).invert();
  const rot = now*0.02;                                        // the whole corridor turns slowly, as one

  for (const m of plates){
    const p = m.userData;
    const ta = window.NodalHost ? 1 : clamp((now - 0.3 - p.delay)/(CONFIG.assemble - 0.9), 0, 1), e = 1 - Math.pow(1 - ta, 3);
    let pos = p.home.slice();
    // cube plates converge radially, all on one scale: gaps only shrink evenly, so nothing crosses; spin is spent while still far out
    q.setFromAxisAngle(p.spinAx, p.float ? (1 - e)*p.spin : (1 - s5(0, 0.5, e))*p.spin);
    if (p.float){
      const th = p.th + now*0.05;
      pos = [Math.cos(th)*p.r, p.ph*p.r*0.6 + Math.sin(now*0.4 + p.th*3)*0.12, Math.sin(th)*p.r];
      q2.setFromAxisAngle(p.tumble, now*p.tumbleSp + p.th*2); q.premultiply(q2);
    }
    const f = 1 + 4.5*(1 - e)*(1 - e);
    pos = p.float ? pos.map((v, i) => lerp(p.from[i], v, e) + p.off[i]) : pos.map((v, i) => v*f + p.off[i]);
    m.position.set(...pos); m.quaternion.copy(q);
    m.scale.setScalar(0.6 + 0.4*s5(0, 0.4, ta));
    // hover: plates near the cursor slide out through their open side, then settle back
    let near = 0;
    if (!p.float && p.push && ta >= 1 && burst < 0.01){
      tmp.set(...p.home).applyMatrix4(cube.matrixWorld).project(camera);
      const sx = (tmp.x*0.5 + 0.5)*innerWidth, sy = (0.5 - tmp.y*0.5)*innerHeight;
      const R0 = innerHeight*0.12; near = Math.exp(-((sx - mouse.px)**2 + (sy - mouse.py)**2)/(R0*R0));
    }
    const tgt = p.push ? p.push.map(v => v*near*0.38) : [0,0,0];
    const kk = 1 - Math.exp(-dt*(near > 0.05 ? 7 : 2.4));
    p.off = p.off.map((v, i) => v + (tgt[i] - v)*kk);
    // world-space base position of every plate (the collision pass works there)
    p.cw = 0;
    if (p.float){
      p.wp.copy(m.position).applyMatrix4(world.matrixWorld); p.cw = burst > 0 ? 1 : 0;
      if (burst > 0){
        flightLocal.copy(world.quaternion).invert().multiply(faceFlight(p.wp, p.flightThin, p.tumble.z*.3, p.th, now));
        m.quaternion.slerp(flightLocal, s5(.05, .8, burst));
      }
      continue;
    }
    p.wp.copy(m.position).applyMatrix4(cube.matrixWorld);
    if (burst > 0){
      // 1) the cube expands evenly: every gap grows, nothing can cross; 2) plates fly to their spot and turn to the path
      const ex = s5(0, 0.45, burst), mv = s5(0.3, 1, burst);
      p.wp.sub(cube.position).multiplyScalar(1 + 1.5*ex).add(cube.position);
      const c = Math.cos(rot), s = Math.sin(rot), b = p.burst;
      va.set(b[0]*c - b[1]*s, b[0]*s + b[1]*c + Math.sin(now*0.5 + p.burstPh)*0.12, b[2]);
      p.wp.lerp(va, mv);
      qa.copy(cube.quaternion).multiply(m.quaternion);
      q2.setFromAxisAngle(p.spinAx, Math.sin(Math.PI*mv)*0.8);
      qa.slerp(faceFlight(p.wp, p.flightThin, p.flightRoll, p.burstPh, now), mv).multiply(q2);
      m.quaternion.copy(qc).multiply(qa);
      p.cw = s5(0.2, 0.5, burst);
    }
  }
  // project screens: picked against last frame's poses, eased so a pass-by never snaps
  cardsLive = true;
  hoverCard = finePointer.matches && mouse.on ? pickCard(mouse.px, mouse.py) : null;
  reportHover(hoverCard);
  const kh = 1 - Math.exp(-dt*7);
  for (const m of field) if (m.userData.photo) { const p = m.userData; p.hov += ((m === hoverCard ? 1 : 0) - p.hov)*kh; }
  // the corridor: plates drift in from the dark as the cube bursts, then hang around the path
  for (const m of field){
    const p = m.userData, inn = p.photo ? 1 - s5(12, 30, camera.position.z - p.z) : s5(p.inAt, p.inAt + 0.25, prog);   // pictures gather as the camera nears
    m.visible = inn > 0.001; p.cw = m.visible ? inn : 0;
    if (!m.visible) continue;
    const th = p.th + rot, r = p.r*(1 + (1 - inn)*3);
    p.wp.set(Math.cos(th)*r*1.25, Math.sin(th)*r*0.8 + Math.sin(now*0.4 + p.ph)*0.15, p.z + Math.sin(now*0.3 + p.ph)*0.35 + (p.hov || 0)*.45);
    m.scale.setScalar((0.4 + 0.6*inn)*(1 + (p.hov || 0)*.08));
    if (p.photo) p.windowMat.emissiveIntensity = 1.1*(1 + p.hov*.12);
  }
  // Orient corridor plates before the SAT pass, not after it.
  for (const m of field) if (m.visible) {
    const p = m.userData;
    m.quaternion.copy(faceFlight(p.wp, 2, p.roll, p.ph, now));
    if (p.hov > .001) m.quaternion.slerp(camera.quaternion, p.hov*.8);
  }
  resolveGlassBodies(bodies, dt);
  for (const m of bodies){
    const p = m.userData;
    if (!m.visible) continue;
    va.copy(p.wp);
    m.position.copy(m.parent.worldToLocal(va));
  }
  // anything past the fog wall (30 units) is already invisible: skip it entirely
  for (const m of bodies){ if (!m.visible) continue; m.getWorldPosition(va); if (va.distanceToSquared(camera.position) > 31*31) m.visible = false; }
  composer.render();
  for (const m of bodies) if (!m.userData.list) m.visible = true;       // cube plates & floaters are re-checked next frame
  finishFrame();
}
function finishFrame(){
  // Keep the same quality governor for glass, energy portal and social scenes.
  if (window.__T == null){
    const real = performance.now(); perf.acc += real - perf.last; perf.last = real; perf.n++;
    if (perf.acc > 1500){
      const ms = perf.acc/perf.n; perf.acc = 0; perf.n = 0;
      perf.slow = ms > 22 ? perf.slow + 1 : 0;
      if (perf.slow >= 2 && dpr > 1){ perf.slow = 0; pendingDpr = Math.max(1, dpr - 0.25); }
    }
  }
  requestAnimationFrame(frame);
}

// preloader: nothing moves until the pictures are decoded, every shader is compiled and every texture sits on the GPU
(async () => {
  const loader = document.getElementById('loader'), bar = loader.querySelector('b'), pct = loader.querySelector('span');
  const setP = v => {
    bar.style.transform = `scaleX(${v})`; pct.textContent = Math.round(v*100) + '%';
    window.NodalHost?.send('loading-progress', { value: v });
  };
  const tick = () => new Promise(r => (window.NodalHost ? window.NodalHost.tick : requestAnimationFrame)(() => r()));
  setP(0.15);
  const photoAtlas = await createBluePhotoAtlas();
  const irisImage = new Image(); irisImage.src = '../assets/img/eye-ball-tex.png';
  await irisImage.decode(); irisTex.image = irisImage; irisTex.needsUpdate = true;
  photoBase.image = photoAtlas; photoBase.needsUpdate = true;
  photoClones.forEach(t => { t.image = photoAtlas; t.needsUpdate = true; });
  destinationTex.needsUpdate = true;
  journey = await createJourney(renderer);
  // Compile the entire continuation while hidden, not during the first portal crossing.
  for (const shot of journey.scenes) {
    try { await renderer.compileAsync(shot.scene, shot.camera); }
    catch { renderer.compile(shot.scene, shot.camera); }
  }
  eyeMat.uniforms.uDestination.value = journey.preview;
  destinationScreen.material.uniforms.uImage.value = journey.preview;
  eyeMat.uniforms.uImageAspect.value = journey.previewAspect;
  destinationScreen.material.uniforms.uImageAspect.value = journey.previewAspect;
  setP(0.35); await tick();
  // everything in view at once for the warm-up: all plates at the origin, camera just in front
  const hidden = bodies.filter(m => !m.visible).concat([eye]); hidden.forEach(m => m.visible = true);
  bodies.forEach(m => { m.position.set(0, 0, 0); m.scale.setScalar(1); m.frustumCulled = false; });
  camera.position.set(0, 0, 6);
  try { await renderer.compileAsync(scene, camera); } catch (e) { renderer.compile(scene, camera); }
  setP(0.65); await tick();
  renderer.initTexture(irisTex); renderer.initTexture(destinationTex); renderer.initTexture(photoBase); panels.forEach(p => (p.clones || []).forEach(t => renderer.initTexture(t))); photoClones.forEach(t => renderer.initTexture(t));
  setP(0.8); await tick();
  for (let i = 0; i < 3; i++){ composer.render(); await tick(); }          // first real frames: buffers, transmission target, bloom chain
  bodies.forEach(m => m.frustumCulled = true); hidden.forEach(m => m.visible = false);
  setP(1); await tick();
  t0 = performance.now(); last = 0; perf.last = performance.now();
  if (window.NodalHost) {
    // Render the assembled, decoded scene before allowing the NODAL light cover to open.
    frame();
    document.documentElement.classList.remove('loading');
    loader.remove(); document.getElementById('hint').remove();
    window.NodalHost.send('scene-ready');
  } else {
    requestAnimationFrame(frame);
    setTimeout(() => { loader.classList.add('done'); document.documentElement.classList.remove('loading'); }, 250);
    setTimeout(() => loader.remove(), 1200);
  }
})();
</script>
